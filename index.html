  <style>
    :root {
      --bg: #0b0d12;
      --bg-elev: #131720;
      --bg-card: #161b26;
      --bg-card-hover: #1c2230;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --text: #f3f5f8;
      --text-muted: #94a0b8;
      --accent: #38bdf8;
      --accent-2: #a855f7;
      --badge-root: rgba(56, 189, 248, 0.14);
      --badge-root-text: #7dd3fc;
      --badge-tour: rgba(168, 85, 247, 0.16);
      --badge-tour-text: #d8b4fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.08), transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(168, 85, 247, 0.08), transparent 40%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 5rem;
    }

    /* Header / Hero */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(11, 13, 18, 0.82);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.25rem 2rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.03em;
      color: #0b0d12;
      box-shadow: 0 4px 18px rgba(56, 189, 248, 0.25);
    }

    .brand-text h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-text p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.9rem 0.55rem 2.25rem;
      border-radius: 9px;
      font-size: 0.88rem;
      width: 250px;
      transition: border-color 0.15s, width 0.2s;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent);
      width: 290px;
    }

    .search-box svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .btn {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.55rem 0.9rem;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      transition: all 0.15s ease;
    }

    .btn:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
    }

    .btn-accent {
      border-color: rgba(168, 85, 247, 0.35);
      background: rgba(168, 85, 247, 0.12);
      color: #e9d5ff;
    }

    .btn-accent:hover {
      background: rgba(168, 85, 247, 0.22);
      border-color: rgba(168, 85, 247, 0.55);
    }

    /* Category Filter Bar */
    .filter-bar {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1rem 2rem 0.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .pill {
      background: var(--bg-elev);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.36rem 0.75rem;
      border-radius: 999px;
      font-size: 0.79rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill:hover {
      color: var(--text);
      border-color: var(--border-hover);
    }

    .pill.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 600;
    }

    .stats-bar {
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    /* Main Content */
    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 1.5rem 2rem;
    }

    .category-section {
      margin-bottom: 3rem;
    }

    .category-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.15rem;
      padding-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
    }

    .category-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .category-header h2 {
      font-size: 1.25rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .category-header .cat-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .category-count {
      font-size: 0.76rem;
      color: var(--text-muted);
      background: var(--bg-elev);
      border: 1px solid var(--border);
      padding: 0.18rem 0.6rem;
      border-radius: 999px;
    }

    /* Grid & Cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    }

    /* Media Preview Box */
    .card-media {
      position: relative;
      height: 196px;
      background: #080a0f;
      overflow: hidden;
    }

    .card-media img.primary-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s;
    }

    .card:hover .card-media img.primary-img {
      transform: scale(1.06);
    }

    /* Creative Multi-Tile / Panorama Strip Mode for items without dedicated outer thumbnail */
    .card-media.creative-pano img.primary-img {
      animation: panoPan 18s ease-in-out infinite alternate;
    }

    @keyframes panoPan {
      0% { object-position: 0% 50%; transform: scale(1.05); }
      100% { object-position: 100% 50%; transform: scale(1.05); }
    }

    /* Inset random tile badge for creative fallback cards */
    .tile-pip {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 66px;
      height: 66px;
      border-radius: 9px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
      background: #000;
      z-index: 3;
      transition: transform 0.25s ease, width 0.25s ease, height 0.25s ease;
    }

    .card:hover .tile-pip {
      transform: scale(1.12);
    }

    .tile-pip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tile-pip-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.72);
      color: #e2e8f0;
      font-size: 9px;
      text-align: center;
      padding: 1px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.02em;
    }

    /* Top overlay badges */
    .media-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 3;
    }

    .badge {
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      backdrop-filter: blur(8px);
    }

    .badge-root {
      background: rgba(11, 13, 18, 0.76);
      color: var(--badge-root-text);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-tour {
      background: rgba(11, 13, 18, 0.76);
      color: var(--badge-tour-text);
      border: 1px solid rgba(168, 85, 247, 0.35);
    }

    .badge-scenes {
      background: rgba(11, 13, 18, 0.76);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Card Body */
    .card-body {
      padding: 1rem 1.15rem 1.15rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.3rem;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 650;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-sub {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .card-meta {
      margin-top: auto;
      padding-top: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.73rem;
      color: #64748b;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .card-meta span.thumb-source {
      color: #94a3b8;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      display: none;
    }

    @media (max-width: 720px) {
      .header-inner, .filter-bar, main {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      .search-box input, .search-box input:focus {
        width: 100%;
      }
    }
  </style>
</head>

    let tileSeed = Math.floor(Math.random() * 10000);

    function pickRandom(arr, offset = 0) {
      if (!arr || arr.length === 0) return null;
      const idx = Math.floor(Math.random() * arr.length);
      return arr[idx];
    }

    function renderPills() {
      const container = document.getElementById("categoryPills");
      const total = CATALOG.items.length;
      let html = `<button class="pill ${activeCategory === "ALL" ? "active" : ""}" data-cat="ALL">All Collections (${total})</button>`;
      for (const cat of CATALOG.categories) {
        const count = CATALOG.items.filter(i => i.category === cat.id).length;
        if (!count) continue;
        html += `<button class="pill ${activeCategory === cat.id ? "active" : ""}" data-cat="${cat.id}">${cat.label} (${count})</button>`;
      }
      container.innerHTML = html;
      container.querySelectorAll(".pill").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.getAttribute("data-cat");
          renderPills();
          renderGallery();
        });
      });
    }

    function renderGallery() {
      const root = document.getElementById("galleryRoot");
      const emptyState = document.getElementById("emptyState");
      const q = searchQuery.trim().toLowerCase();

      const filtered = CATALOG.items.filter(item => {
        if (activeCategory !== "ALL" && item.category !== activeCategory) return false;
        if (activePattern !== "ALL" && item.pattern !== activePattern) return false;
        if (q) {
          const hay = `${item.title} ${item.subtitle} ${item.categoryLabel} ${item.href}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      document.getElementById("visibleCount").textContent =
        `Showing ${filtered.length} of ${CATALOG.items.length} panoramas`;

      if (filtered.length === 0) {
        root.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      let sectionsHtml = "";
      for (const cat of CATALOG.categories) {
        const catItems = filtered.filter(i => i.category === cat.id);
        if (catItems.length === 0) continue;

        let cardsHtml = "";
        for (const item of catItems) {
          const hasOuter = Boolean(item.outerThumb);
          // For items with a dedicated outer thumbnail, use it directly.
          // For items without a dedicated outer thumbnail, pick a random scene preview or data thumbnail + random high-res tile inset from <root>data / tourdata!
          const randomPreview = pickRandom(item.previews) || item.dataThumb;
          const randomTile = pickRandom(item.tiles);
          const primarySrc = hasOuter ? item.outerThumb : (randomPreview || randomTile || item.dataThumb);
          const fallbackSrc = item.dataThumb || randomTile || "";

          const parts = item.href.split("/");
          const fileName = parts[parts.length - 1];
          const picLabel = (fileName === "tour.html" && parts.length >= 2)
            ? `${parts[parts.length - 2]}/tour.html`
            : fileName;

          const patternBadge = item.pattern === "tour"
            ? `<span class="badge badge-tour">${picLabel}</span>`
            : `<span class="badge badge-root">${picLabel}</span>`;

          const scenesBadge = item.scenes > 1
            ? `<span class="badge badge-scenes">${item.scenes} Scenes</span>`
            : "";

          const pipHtml = (!hasOuter && randomTile)
            ? `<div class="tile-pip" title="Random tile sampled from ${item.dataDir}: ${randomTile}">
                 <img src="./${randomTile}" loading="lazy" alt="Sample tile" />
                 <div class="tile-pip-label">tile sample</div>
               </div>`
            : (hasOuter && randomTile)
            ? `<div class="tile-pip" title="Detail tile from ${item.dataDir}: ${randomTile}">
                 <img src="./${randomTile}" loading="lazy" alt="Detail tile" />
                 <div class="tile-pip-label">zoom tile</div>
               </div>`
            : "";

          const thumbNote = hasOuter
            ? item.outerThumb.split("/").pop()
            : `🎲 ${ (randomPreview || randomTile || "").split("/").slice(-2).join("/") }`;

          cardsHtml += `
            <a class="card" href="./${item.href}">
              <div class="card-media ${hasOuter ? "" : "creative-pano"}">
                <img
                  class="primary-img"
                  src="./${primarySrc}"
                  loading="lazy"
                  alt="${item.title}"
                  onerror="if (this.dataset.fallback && this.src !== this.dataset.fallback) this.src = this.dataset.fallback;"
                  data-fallback="./${fallbackSrc}"
                />
                <div class="media-badges">
                  ${patternBadge}
                  ${scenesBadge}
                </div>
                ${pipHtml}
              </div>
              <div class="card-body">
                <div class="card-title">${item.title}</div>
                <div class="card-sub">${item.subtitle}</div>
                <div class="card-meta">
                  <span>${item.href}</span>
                  <span class="thumb-source" title="Thumbnail source">${thumbNote}</span>
                </div>
              </div>
            </a>
          `;
        }

        sectionsHtml += `
          <section class="category-section" id="cat-${cat.id}">
            <div class="category-header">
              <div class="category-title-wrap">
                <h2>${cat.label}</h2>
                <span class="cat-desc">${cat.desc}</span>
              </div>
              <span class="category-count">${catItems.length} ${catItems.length === 1 ? "panorama" : "panoramas"}</span>
            </div>
            <div class="grid">
              ${cardsHtml}
            </div>
          </section>
        `;
      }

      root.innerHTML = sectionsHtml;
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderGallery();
    });

    document.getElementById("patternFilterBtn").addEventListener("click", () => {
      const order = ["ALL", "root", "tour"];
      activePattern = order[(order.indexOf(activePattern) + 1) % order.length];
      const counts = {
        ALL: `All (${CATALOG.items.length})`,
        root: `Pictures (${CATALOG.items.filter(i => i.pattern === "root").length})`,
        tour: `Tours (${CATALOG.items.filter(i => i.pattern === "tour").length})`,
      };
      document.getElementById("patternLabel").textContent = counts[activePattern];
      renderGallery();
    });

    document.getElementById("shuffleTilesBtn").addEventListener("click", () => {
      tileSeed++;
      renderGallery();
    });

    renderPills();
    renderGallery();
  </script>
</body>
</html>
